<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASRA | ورود</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        :root { --kakao-yellow: #FEE500; --kakao-dark: #3C1E1E; --kakao-gray: #F5F5F5; --bg-main: #FFFFFF; --text-main: #191919; --border-color: #E5E5E5; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .login-container { width: 100%; max-width: 400px; padding: 30px; text-align: center; }
        .logo { font-size: 40px; font-weight: 800; color: var(--kakao-dark); margin-bottom: 10px; letter-spacing: -2px; }
        .subtitle { font-size: 14px; color: #888; margin-bottom: 30px; }
        
        .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 16px; outline: none; background: var(--kakao-gray); text-align: center; transition: 0.2s; }
        .auth-input:focus { border-color: var(--kakao-dark); background: #fff; }
        
        .auth-btn { width: 100%; padding: 15px; background: var(--kakao-yellow); color: var(--kakao-dark); border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .auth-btn:active { transform: scale(0.98); }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .avatar-picker { width: 100px; height: 100px; border-radius: 50%; background: var(--kakao-gray); margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; overflow: hidden; border: 2px dashed #ccc; }
        .avatar-picker img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-picker span { font-size: 12px; color: #888; }
        
        .skip-btn { background: none; border: none; color: #888; font-size: 14px; margin-top: 15px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">ASRA</div>
        <div class="subtitle">پیام‌رسان امن</div>

        <!-- مرحله ۱: شماره -->
        <div class="step active" id="step-phone">
            <input type="tel" id="phoneNumber" class="auth-input" placeholder="شماره موبایل (مثلاً 09123456789)" style="direction: ltr;">
            <button class="auth-btn" onclick="sendCode()" id="sendCodeBtn">دریافت کد ورود</button>
        </div>

        <!-- مرحله ۲: کد تایید -->
        <div class="step" id="step-code">
            <p style="margin-bottom: 15px; font-size: 14px;">کد ۶ رقمی ارسال شده را وارد کنید:</p>
            <input type="text" id="otpCode" class="auth-input" placeholder="------" maxlength="6" style="letter-spacing: 10px; font-size: 24px; direction: ltr;">
            <button class="auth-btn" onclick="verifyCode()" id="verifyBtn">تایید</button>
        </div>

        <!-- مرحله ۳: پروفایل -->
        <div class="step" id="step-profile">
            <div class="avatar-picker" onclick="document.getElementById('profilePicInput').click()">
                <span>انتخاب عکس</span>
                <input type="file" id="profilePicInput" accept="image/*" style="display: none;" onchange="previewProfilePic(event)">
            </div>
            
            <input type="text" id="displayName" class="auth-input" placeholder="نام نمایشی (اجباری)">
            <input type="text" id="username" class="auth-input" placeholder="نام کاربری (اختیاری)" style="direction: ltr;">
            <input type="text" id="bio" class="auth-input" placeholder="بیوگرافی (اختیاری)">
            
            <button class="auth-btn" onclick="completeRegistration()">ورود به برنامه</button>
            <button class="skip-btn" onclick="skipProfileDetails()">رد کردن نام کاربری و بیو</button>
        </div>
    </div>

    <script>
        // لینک جدید از خروجی Pinggy (با co+)
        const SMS_SERVER_URL = 'https://ciwhn-2a02-4540-910e-3086-1c7a-6e65-f922-106f.free.pinggy.net';
        
        let userPhone = '';
        let tempPic = '';

        // مرحله ۱: ارسال درخواست به سرور گوشی (Termux)
        async function sendCode() {
            const phone = document.getElementById('phoneNumber').value.trim();
            if (!phone || phone.length < 10) return alert('شماره موبایل را صحیح وارد کنید');
            
            userPhone = phone;
            const btn = document.getElementById('sendCodeBtn');
            btn.innerText = 'در حال ارسال پیامک...';
            btn.disabled = true;

            try {
                const response = await fetch(`${SMS_SERVER_URL}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone })
                });

                if (response.ok) {
                    document.getElementById('step-phone').classList.remove('active');
                    document.getElementById('step-code').classList.add('active');
                } else {
                    alert('خطا در ارسال پیامک از سرور');
                    btn.innerText = 'دریافت کد ورود';
                    btn.disabled = false;
                }
            } catch (error) {
                alert('خطا در ارتباط با سرور. مطمئن شوید تونل روشن است و با دستور co+ اجرا شده است.');
                console.error(error);
                btn.innerText = 'دریافت کد ورود';
                btn.disabled = false;
            }
        }

        // مرحله ۲: تایید کد
        async function verifyCode() {
            const code = document.getElementById('otpCode').value.trim();
            if (code.length !== 6) return alert('کد باید ۶ رقم باشد');
            
            const btn = document.getElementById('verifyBtn');
            btn.innerText = 'در حال بررسی...';
            btn.disabled = true;

            try {
                const response = await fetch(`${SMS_SERVER_URL}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: userPhone, code: code })
                });

                if (response.ok) {
                    document.getElementById('step-code').classList.remove('active');
                    document.getElementById('step-profile').classList.add('active');
                } else {
                    alert('کد وارد شده اشتباه یا منقضی شده است');
                    btn.innerText = 'تایید';
                    btn.disabled = false;
                }
            } catch (error) {
                alert('خطا در ارتباط با سرور');
                btn.innerText = 'تایید';
                btn.disabled = false;
            }
        }

        // مرحله ۳: تنظیم پروفایل
        function previewProfilePic(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                tempPic = ev.target.result;
                const picker = document.querySelector('.avatar-picker');
                picker.innerHTML = `<img src="${tempPic}">`;
                picker.appendChild(e.target); 
            };
            reader.readAsDataURL(file);
        }

        function completeRegistration() {
            const displayName = document.getElementById('displayName').value.trim();
            const username = document.getElementById('username').value.trim();
            const bio = document.getElementById('bio').value.trim();
            
            if (!displayName) return alert('نام نمایشی اجباری است!');
            
            const userObj = {
                phone: userPhone,
                name: displayName,
                username: username || 'user_' + Math.random().toString(36).substring(2, 6),
                bio: bio,
                pic: tempPic
            };
            
            localStorage.setItem('asra_user', JSON.stringify(userObj));
            window.location.href = 'chat.html'; // هدایت به برنامه اصلی
        }

        function skipProfileDetails() {
            const displayName = document.getElementById('displayName').value.trim();
            if (!displayName) return alert('لطفاً ابتدا نام نمایشی را وارد کنید');
            
            const userObj = {
                phone: userPhone,
                name: displayName,
                username: 'user_' + Math.random().toString(36).substring(2, 6),
                bio: '',
                pic: ''
            };
            localStorage.setItem('asra_user', JSON.stringify(userObj));
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
